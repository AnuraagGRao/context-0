[project]
name = "context0-backend"
version = "0.1.0"
description = "Context0 FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "sqlalchemy==2.0.30",
    "asyncpg==0.29.0",
    "alembic==1.13.1",
    "pydantic[email]==2.7.1",
    "pydantic-settings==2.2.1",
    "python-jose[cryptography]==3.4.0",
    "bcrypt>=4.0.0",
    "python-multipart==0.0.22",
    "httpx==0.27.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
