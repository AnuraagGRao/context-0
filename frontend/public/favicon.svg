<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="c0Grad" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="20" y1="16" x2="44" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glowC0" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#a855f7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="#090714" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="url(#c0Grad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Outer Quiz Target Ring / Question Arc -->
  <circle cx="32" cy="32" r="22" stroke="url(#c0Grad)" stroke-width="2.5" stroke-dasharray="8 4" stroke-opacity="0.8" />

  <!-- Inner Glowing Zero / Portal "0" -->
  <ellipse cx="32" cy="32" rx="11" ry="15" stroke="url(#c0Grad)" stroke-width="3.5" fill="#130d29" filter="url(#glowC0)" />

  <!-- Core Spark / Trivia Target Point -->
  <circle cx="32" cy="32" r="3.5" fill="#38bdf8" />
  
  <!-- Subtle North/South/East/West Target Accents -->
  <line x1="32" y1="6" x2="32" y2="10" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
  <line x1="32" y1="54" x2="32" y2="58" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
  <line x1="6" y1="32" x2="10" y2="32" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
  <line x1="54" y1="32" x2="58" y2="32" stroke="#a855f7" stroke-width="2" stroke-linecap="round" />
</svg>