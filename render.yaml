databases:
  - name: context0-db
    databaseName: quiz_db
    user: quiz_user
    plan: free

services:
  # ── Python FastAPI Backend ──────────────────────────────────────────────────
  - type: web
    name: context0-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port 10000
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: context0-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: PORT
        value: 10000

  # ── React Frontend (Static Site) ────────────────────────────────────────────
  - type: web
    name: context0-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: context0-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
